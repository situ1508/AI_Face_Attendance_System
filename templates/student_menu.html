<style>

.option-card{

    background:#101C2E;

    border-radius:20px;

    padding:40px;

    text-align:center;

    transition:.3s;

    cursor:pointer;

    text-decoration:none;

    color:white;

    display:block;

    height:100%;

}

.option-card:hover{

    transform:translateY(-8px);

    box-shadow:0 20px 40px rgba(37,99,235,.35);

    color:white;

}

.option-card i{

    font-size:60px;

    margin-bottom:20px;

}

.option-card h3{

    margin-bottom:10px;

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

<i class="fas fa-user-shield"></i>

<h2>AI Attendance</h2>

</div>

<ul>

<li><a href="/dashboard">
<i class="fas fa-house"></i> Dashboard
</a></li>

<li><a class="active" href="/students">
<i class="fas fa-user-graduate"></i> Students
</a></li>

<li><a href="/train_model">
<i class="fas fa-brain"></i> Train Model
</a></li>

<li><a href="/start_attendance">
<i class="fas fa-camera"></i> Attendance
</a></li>

<li><a href="/reports">
    <i class="fas fa-chart-column"></i>
    Reports
</a></li>

</ul>

</div>

<div class="main-content">

<div class="topbar">

<div>

<h2>Student Management</h2>

<p>Select an option</p>

</div>

</div>

<div class="row mt-5">

<div class="col-md-6 mb-4">

<a href="/new_student" class="option-card">

<i class="fas fa-user-plus text-primary"></i>

<h3>New Student</h3>

<p>Add a new student and capture face later.</p>

</a>

</div>

<div class="col-md-6 mb-4">

<a href="/registered_students" class="option-card">

<i class="fas fa-users text-success"></i>

<p>View, edit, delete and capture faces.</p>

</a>

</div>

</div>

</div>
