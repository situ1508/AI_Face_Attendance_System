<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Students</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

</head>

<body>

<div class="sidebar">

<div class="logo">
<i class="fas fa-user-shield"></i>
<h2>AI Attendance</h2>
</div>

<ul>

<li><a href="/dashboard">
<i class="fas fa-house"></i> Dashboard
</a></li>

<li><a class="active" href="/students">
<i class="fas fa-user-graduate"></i> Students
</a></li>

<li><a href="/train_model">
<i class="fas fa-brain"></i> Train Model
</a></li>

<li><a href="/start_attendance">
<i class="fas fa-camera"></i> Attendance
</a></li>

<li><a href="/attendance">
<i class="fas fa-chart-column"></i> Reports
</a></li>

<li><a href="/">
<i class="fas fa-right-from-bracket"></i> Logout
</a></li>

</ul>

</div>

<div class="main-content">

<div class="topbar">

<h2>Student Management</h2>

</div>

<div class="row mt-4">

<div class="col-lg-4">

<div class="panel">

<h4 class="mb-4">
<i class="fas fa-user-plus"></i>
Add Student
</h4>

<form method="POST" action="/add_student">

<div class="mb-3">
<label>Student ID</label>
<input class="form-control" name="student_id" required>
</div>

<div class="mb-3">
<label>Name</label>
<input class="form-control" name="name" required>
</div>

<div class="mb-3">
<label>Department</label>
<input class="form-control" name="department" required>
</div>

<div class="mb-3">
<label>Semester</label>
<input class="form-control" name="semester" required>
</div>

<div class="mb-3">
<label>Section</label>
<input class="form-control" name="section">
</div>

<div class="mb-3">
<label>Email</label>
<input class="form-control" name="email">
</div>

<div class="mb-3">
<label>Phone</label>
<input class="form-control" name="phone">
</div>

<button class="btn btn-primary w-100">

<i class="fas fa-floppy-disk"></i>

Save Student

</button>

</form>

</div>

</div>

<div class="col-lg-8">

<div class="panel">

<div class="d-flex justify-content-between align-items-center mb-3">

<h4>

<i class="fas fa-users"></i>

Registered Students

</h4>

<input class="form-control w-25"
placeholder="Search">

</div>

<table class="table table-dark table-hover">

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Department</th>
<th>Semester</th>
<th>Action</th>

</tr>

</thead>

<tbody>

{% for student in students %}

<tr>

<td>{{ student[0] }}</td>

<td>{{ student[1] }}</td>

<td>{{ student[2] }}</td>

<td>{{ student[3] }}</td>

<td>

<a href="/capture_face/{{ student[0] }}"
class="btn btn-primary btn-sm">

<i class="fas fa-camera"></i>

</a>

<a href="/edit_student/{{ student[0] }}"
class="btn btn-warning btn-sm">

<i class="fas fa-edit"></i>

</a>

<a href="/delete_student/{{ student[0] }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete Student?')">

<i class="fas fa-trash"></i>

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</div>

</body>

</html>
