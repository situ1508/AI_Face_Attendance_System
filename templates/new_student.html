<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>New Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/dashboard.css') }}">

</head>

<body>

<div class="sidebar">

<div class="logo">

<i class="fas fa-user-shield"></i>

<h2>AI Attendance</h2>

</div>

<ul>

<li><a href="/dashboard"><i class="fas fa-house"></i> Dashboard</a></li>

<li><a class="active" href="/students"><i class="fas fa-user-graduate"></i> Students</a></li>

<li><a href="/attendance"><i class="fas fa-calendar-check"></i> Attendance</a></li>

</ul>

</div>

<div class="main-content">

<div class="topbar">

<div class="topbar">

    <div>
        <h2><i class="fas fa-user-plus"></i> Add New Student</h2>
        <p>Register a new student into the AI Attendance System</p>
    </div>

    <a href="/registered_students" class="btn btn-primary">
        <i class="fas fa-arrow-left"></i> Back
    </a>

</div>

<div class="panel mt-4">

<h4 class="mb-4">
    <i class="fas fa-id-card"></i>
    Student Information
</h4>

<form method="POST" action="/add_student">

<div class="row">

<div class="col-md-6 mb-3">

<label>Student ID</label>
<div class="input-group">
    <span class="input-group-text">
        <i class="fas fa-id-card"></i>
    </span>

    <input
        type="number"
        class="form-control"
        name="student_id"
        placeholder="Enter Student ID"
        required>
</div>

</div>

<div class="col-md-6 mb-3">

<label>Student Name</label>

<div class="input-group">
    <span class="input-group-text">
        <i class="fas fa-user"></i>
    </span>

    <input
        type="text"
        class="form-control"
        name="name"
        placeholder="Enter Student Name"
        required>
</div>
</div>

<div class="col-md-6 mb-3">

<label>Department</label>

<div class="input-group">
    <span class="input-group-text">
        <i class="fas fa-building"></i>
    </span>

    <input
        type="text"
        class="form-control"
        name="department"
        placeholder="Department"
        required>
</div>

</div>

<div class="col-md-6 mb-3">

<label>Semester</label>

<div class="input-group">
    <span class="input-group-text">
        <i class="fas fa-book"></i>
    </span>

    <input
        type="text"
        class="form-control"
        name="semester"
        placeholder="Semester"
        required>
</div>

</div>

<div class="col-md-6 mb-3">

<label>Section</label>

<div class="input-group">
    <span class="input-group-text">
        <i class="fas fa-layer-group"></i>
    </span>

    <input
        type="text"
        class="form-control"
        name="section"
        placeholder="Section">
</div>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<div class="input-group">
    <span class="input-group-text">
        <i class="fas fa-envelope"></i>
    </span>

    <input
        type="email"
        class="form-control"
        name="email"
        placeholder="Email Address">
</div>

</div>

<div class="col-md-6 mb-3">

<label>Phone</label>

<div class="input-group">
    <span class="input-group-text">
        <i class="fas fa-phone"></i>
    </span>

    <input
        type="text"
        class="form-control"
        name="phone"
        placeholder="Phone Number">
</div>
</div>

</div>
<div class="mt-4 d-flex gap-3">

    <button class="btn btn-success px-4">
        <i class="fas fa-floppy-disk"></i>
        Save Student
    </button>

    <a href="/registered_students" class="btn btn-secondary px-4">
        Cancel
    </a>

</div>

</form>

</div>

</div>

</body>

</html>
