<div class="card mt-4 bg-white text-dark">

<h4>📋 Recent Attendance</h4>

<table class="table table-striped">

<tr>
<th>ID</th>
<th>Name</th>
<th>Date</th>
<th>Time</th>
</tr>

{% for row in recent_records %}

<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
</tr>

{% endfor %}

</table>

</div>
