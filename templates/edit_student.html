<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow p-4">

<h2>Edit Student</h2>

<form method="POST" action="/update_student">

<input type="hidden"
name="student_id"
value="{{ student[0] }}">

<div class="mb-3">
<label>Name</label>
<input type="text"
name="name"
class="form-control"
value="{{ student[1] }}">
</div>

<div class="mb-3">
<label>Department</label>
<input type="text"
name="department"
class="form-control"
value="{{ student[2] }}">
</div>

<div class="mb-3">
<label>Semester</label>
<input type="text"
name="semester"
class="form-control"
value="{{ student[3] }}">
</div>

<div class="mb-3">
<label>Section</label>
<input type="text"
name="section"
class="form-control"
value="{{ student[4] }}">
</div>

<div class="mb-3">
<label>Email</label>
<input type="email"
name="email"
class="form-control"
value="{{ student[5] }}">
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text"
name="phone"
class="form-control"
value="{{ student[6] }}">
</div>

<button class="btn btn-success">
Update Student
</button>

</form>

</div>

</div>

</body>
</html>
