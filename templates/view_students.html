<!DOCTYPE html>
<html>
<head>
    <title>Students List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">Registered Students</h2>

<a href="/students" class="btn btn-success mb-3">
➕ Add New Student
</a>
<form method="GET" action="/students" class="mb-4">

<div class="input-group">

<input
    type="text"
    name="search"
    class="form-control"
    placeholder="Search by Student ID or Name"
    value="{{ search }}">

<button class="btn btn-primary">
    🔍 Search
</button>

<a href="/students" class="btn btn-secondary">
    Reset
</a>

</div>

</form>
<table class="table table-bordered table-hover table-striped">

<thead class="table-dark">

<tr>
    <th>Student ID</th>
    <th>Name</th>
    <th>Department</th>
    <th>Semester</th>
    <th>Section</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Action</th>
</tr>

</thead>

<tbody>

{% for student in students %}

<tr>

<td>{{ student[0] }}</td>
<td>{{ student[1] }}</td>
<td>{{ student[2] }}</td>
<td>{{ student[3] }}</td>
<td>{{ student[4] }}</td>
<td>{{ student[5] }}</td>
<td>{{ student[6] }}</td>

<td>
    <a href="/capture_face/{{ student[0] }}" class="btn btn-primary btn-sm">
        📷 Capture Face
    </a>
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
